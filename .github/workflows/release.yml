name: OpenLidarStudio Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Linux build (Ubuntu 22.04, GCC)
  # ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev \
            xorg-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libudev-dev \
            cmake ninja-build

      - name: Configure CMake (Release)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -G Ninja

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir -p dist/OpenLidarStudio-Linux
          cp build/OpenLidarStudio dist/OpenLidarStudio-Linux/
          cp -r assets               dist/OpenLidarStudio-Linux/
          cp README.md               dist/OpenLidarStudio-Linux/
          cp -r docs                 dist/OpenLidarStudio-Linux/
          cd dist
          tar -czvf ../OpenLidarStudio-Linux-${{ github.ref_name }}.tar.gz OpenLidarStudio-Linux/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: OpenLidarStudio-Linux-${{ github.ref_name }}.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────
  # Windows build (Windows Server 2022, MSVC)
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake (Release)
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist\OpenLidarStudio-Windows"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "build\Release\OpenLidarStudio.exe" $dist\
          Copy-Item -Recurse "assets"  $dist\
          Copy-Item "README.md"        $dist\
          Copy-Item -Recurse "docs"    $dist\
          Compress-Archive -Path "$dist\*" `
            -DestinationPath "OpenLidarStudio-Windows-${{ github.ref_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: OpenLidarStudio-Windows-${{ github.ref_name }}.zip
          retention-days: 1

  # ─────────────────────────────────────────────
  # macOS build (macOS Latest, Apple Clang)
  # ─────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply ydlidar_sdk macOS patch
        run: cd 3rdparty/ydlidar_sdk && git apply ../../patches/ydlidar_sdk.patch

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Configure CMake (Release)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -G Ninja

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir -p dist/OpenLidarStudio-macOS
          cp build/OpenLidarStudio dist/OpenLidarStudio-macOS/
          cp -r assets               dist/OpenLidarStudio-macOS/
          cp README.md               dist/OpenLidarStudio-macOS/
          cp -r docs                 dist/OpenLidarStudio-macOS/
          cd dist
          tar -czvf ../OpenLidarStudio-macOS-${{ github.ref_name }}.tar.gz OpenLidarStudio-macOS/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: OpenLidarStudio-macOS-${{ github.ref_name }}.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────
  # GitHub Release — attaches both packages
  # ─────────────────────────────────────────────
  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Download all artifacts into the working directory (merge-multiple flattens subdirs)
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: List downloaded files (debug)
        run: find release-assets -type f

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum \
            OpenLidarStudio-Linux-${{ github.ref_name }}.tar.gz \
            OpenLidarStudio-Windows-${{ github.ref_name }}.zip \
            OpenLidarStudio-macOS-${{ github.ref_name }}.tar.gz \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OpenLidarStudio ${{ github.ref_name }}"
          body: |
            ## OpenLidarStudio ${{ github.ref_name }}

            ### Installation

            **Linux**
            ```bash
            tar -xzvf OpenLidarStudio-Linux-${{ github.ref_name }}.tar.gz
            cd OpenLidarStudio-Linux
            ./OpenLidarStudio
            ```
            > Serial port access: `sudo usermod -aG dialout $USER` (then log out/in)

            **Windows**
            Unzip `OpenLidarStudio-Windows-${{ github.ref_name }}.zip` and run `OpenLidarStudio.exe`.

            **macOS**
            ```bash
            tar -xzvf OpenLidarStudio-macOS-${{ github.ref_name }}.tar.gz
            cd OpenLidarStudio-macOS
            ./OpenLidarStudio
            ```

            ### Supported Hardware
            | Model | Baudrate | Single-Channel |
            |---|---|---|
            | YDLIDAR X2 | 115200 | ✅ Required |
            | YDLIDAR X4 | 128000 | ❌ |
            | YDLIDAR G4 | 230400 | ❌ |
            | YDLIDAR S2 | 115200 | ✅ Required |

            ### SHA256 Checksums
            See `SHA256SUMS.txt` attached below.

            ---
            Full documentation: [README](https://github.com/${{ github.repository }}/blob/main/README.md) · [UI Guide](https://github.com/${{ github.repository }}/blob/main/docs/UI_GUIDE.md)
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            release-assets/OpenLidarStudio-Linux-${{ github.ref_name }}.tar.gz
            release-assets/OpenLidarStudio-Windows-${{ github.ref_name }}.zip
            release-assets/OpenLidarStudio-macOS-${{ github.ref_name }}.tar.gz
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
