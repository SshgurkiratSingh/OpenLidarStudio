; PlatformIO Project Configuration File
;
; Standalone I2C bus scanner + random-data OLED demo.
; Requires an ESP32 dev board and an I2C SSD1306 OLED at 0x3C.
;
; The firmware scans the ENTIRE I2C address range (0x01..0x7F) and shows the
; detected devices plus a live random value on the OLED.
;
; Default I2C pins are SDA=21, SCL=22. Override with build_flags if needed:
;   build_flags = -D I2C_SDA=16 -D I2C_SCL=17
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306